name: Generate JabulaniFM Script
on:
  workflow_dispatch:
    inputs:
      show_slug: {description: Show slug, required: true, default: money-desk}
      topic: {description: Editorial topic, required: true}
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Generate validated script payload
        env:
          SHOW: ${{ github.event.inputs.show_slug || 'money-desk' }}
          TOPIC: ${{ github.event.inputs.topic || 'South African practical intelligence briefing' }}
        run: python github-actions/scripts/generate_script.py --show "$SHOW" --topic "$TOPIC" --output script.json
      - uses: actions/upload-artifact@v4
        with:
          name: jabulanifm-script-${{ github.run_id }}
          path: script.json
          retention-days: 7
